name: Docker Image bauen

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: docker
    timeout-minutes: 150
    steps:
      - name: Repository auschecken
        run: |
          REPO_DIR="/data/repo"
          if [ -d "$REPO_DIR/.git" ]; then
            git -C "$REPO_DIR" remote set-url origin ${{ gitea.server_url }}/${{ gitea.repository }}.git
            git -C "$REPO_DIR" fetch --depth=1 origin ${{ gitea.ref_name }}
            git -C "$REPO_DIR" reset --hard FETCH_HEAD
            git -C "$REPO_DIR" clean -fd
          else
            git -c pack.windowMemory=0 -c pack.packSizeLimit=0 clone \
              --depth=1 --no-tags \
              --branch=${{ gitea.ref_name }} \
              ${{ gitea.server_url }}/${{ gitea.repository }}.git "$REPO_DIR"
          fi
          ln -sfn "$REPO_DIR" repo

      - name: Image bauen und taggen
        env:
          DOCKER_BUILDKIT: "1"
        run: |
          cd repo
          docker build \
            -t erp-handwerk:main \
            -t "erp-handwerk:${{ gitea.sha }}" \
            .
          echo "Image erp-handwerk:main gebaut"

      - name: "Alte Images aufräumen (letzte 5 behalten)"
        run: |
          docker images erp-handwerk --format '{{.ID}} {{.CreatedAt}}' \
            | sort -k2 -r \
            | awk 'NR>5 {print $1}' \
            | xargs -r docker rmi || true

      - name: Build-Ergebnis
        run: docker images erp-handwerk:main
