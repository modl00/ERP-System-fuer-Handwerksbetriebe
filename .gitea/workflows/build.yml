name: Docker Image bauen

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: docker
    timeout-minutes: 150
    steps:
      - name: Repository auschecken
        run: |
          wget -q \
            "${{ gitea.server_url }}/${{ gitea.repository }}/archive/${{ gitea.ref_name }}.tar.gz" \
            -O /tmp/repo.tar.gz
          rm -rf repo
          mkdir repo
          tar -xzf /tmp/repo.tar.gz -C repo --strip-components=1
          rm -f /tmp/repo.tar.gz

      - name: Image bauen und taggen
        env:
          DOCKER_BUILDKIT: "1"
        run: |
          cd repo
          docker build \
            -t erp-handwerk:main \
            -t "erp-handwerk:${{ gitea.sha }}" \
            .
          echo "Image erp-handwerk:main gebaut"

      - name: "Alte Images aufräumen (letzte 5 behalten)"
        run: |
          docker images erp-handwerk --format '{{.ID}} {{.CreatedAt}}' \
            | sort -k2 -r \
            | awk 'NR>5 {print $1}' \
            | xargs -r docker rmi || true

      - name: Build-Ergebnis
        run: docker images erp-handwerk:main
